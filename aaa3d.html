<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,">
    <title>回煞：次世代视觉线</title>
    <style>
        :root { color-scheme: dark; --paper: #d8cdb4; --blood: #7e1715; --glass: rgba(10, 12, 14, 0.7); }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body { margin: 0; overflow: hidden; background: #030405; color: var(--paper); font-family: "Microsoft YaHei UI", "Noto Sans SC", sans-serif; }
        #three-root { position: fixed; inset: 0; background: #030405; }
        #three-root canvas { display: block; width: 100%; height: 100%; }
        .cinema-grade, .grain, .vignette { position: fixed; inset: 0; pointer-events: none; }
        .cinema-grade { z-index: 1; background: linear-gradient(180deg, rgba(12, 25, 35, .12), transparent 42%, rgba(35, 10, 6, .1)); mix-blend-mode: color; }
        .grain { z-index: 2; inset: -2px; opacity: .055; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E"); animation: grain .32s steps(2) infinite; }
        .vignette { z-index: 3; background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.26) 72%, rgba(0,0,0,.72) 112%); }
        @keyframes grain { 0%{transform:translate(0,0)} 25%{transform:translate(-1px,1px)} 50%{transform:translate(1px,-1px)} 75%{transform:translate(1px,1px)} 100%{transform:translate(-1px,0)} }
        .hud { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
        .mission { position: absolute; top: 28px; left: 30px; width: min(430px, calc(100vw - 60px)); border-left: 2px solid var(--blood); padding: 3px 0 3px 15px; text-shadow: 0 2px 8px #000; }
        .eyebrow { display: block; margin-bottom: 7px; color: rgba(216,205,180,.55); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; }
        .objective { color: rgba(244,235,213,.9); font-size: 14px; line-height: 1.6; }
        .objective.is-complete { color: #dfc389; }
        .return-link { position: absolute; top: 26px; right: 30px; pointer-events: auto; border: 1px solid rgba(216,205,180,.22); background: rgba(5,7,8,.46); backdrop-filter: blur(12px); color: rgba(235,225,202,.76); padding: 10px 15px; font: inherit; font-size: 12px; letter-spacing: .08em; cursor: pointer; }
        .return-link:hover { color: #fff; border-color: rgba(255,255,255,.5); }
        .reticle { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; transform: translate(-50%,-50%); border: 1px solid rgba(245,237,216,.55); border-radius: 50%; box-shadow: 0 0 8px rgba(255,240,210,.18); }
        .prompt { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%) translateY(8px); min-width: 300px; padding: 10px 18px; text-align: center; color: rgba(248,239,217,.93); font-size: 13px; letter-spacing: .05em; opacity: 0; transition: .18s ease; text-shadow: 0 2px 8px #000; background: linear-gradient(90deg, transparent, rgba(5,7,8,.58), transparent); }
        .prompt.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .controls { position: absolute; left: 30px; bottom: 24px; color: rgba(216,205,180,.42); font-size: 10px; letter-spacing: .06em; text-shadow: 0 2px 6px #000; }
        .dialog { position: fixed; z-index: 8; left: 50%; bottom: 7%; transform: translateX(-50%); width: min(700px, calc(100vw - 44px)); display: none; padding: 22px 24px; border: 1px solid rgba(216,205,180,.18); border-top-color: rgba(216,205,180,.38); background: rgba(5,7,8,.84); backdrop-filter: blur(18px); box-shadow: 0 20px 80px rgba(0,0,0,.55); }
        .dialog.is-visible { display: block; }
        .dialog h2 { margin: 0 0 9px; color: #b64035; font: 500 15px/1.4 "Microsoft YaHei UI", sans-serif; letter-spacing: .16em; }
        .dialog p { margin: 0; color: rgba(240,232,211,.86); font: 14px/1.9 "SimSun", serif; }
        .dialog button { margin-top: 16px; border: 0; border-bottom: 1px solid rgba(216,205,180,.36); background: transparent; color: rgba(240,232,211,.72); padding: 5px 2px; cursor: pointer; }
        body.qa-clean .hud, body.qa-clean .grain { display: none; }
        @media (max-width: 680px) { .mission{top:18px;left:18px}.return-link{top:18px;right:18px}.controls{left:18px;bottom:16px}.prompt{min-width:min(320px,calc(100vw - 36px))} }
    </style>
</head>
<body>
    <main id="three-root" aria-label="回煞次世代视觉线"></main>
    <div class="cinema-grade"></div><div class="grain"></div><div class="vignette"></div>
    <div class="hud">
        <div class="mission"><span class="eyebrow">Huisha / Dynamic VFX Build 04</span><div class="objective" id="objective-panel">目标：调查供桌、棺材和黑布相框</div></div>
        <button class="return-link" id="return-title" type="button">返回标题</button>
        <div class="reticle"></div>
        <div class="prompt" id="interaction-prompt">靠近物件后按 E 调查</div>
        <div class="controls">WASD 移动 · 鼠标观察 · E 调查 · 点击画面锁定视角</div>
    </div>
    <div class="dialog" id="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <h2 id="dialog-title">调查</h2><p id="dialog-text"></p><button id="dialog-close" type="button">继续</button>
    </div>
    <script src="vendor/three.min.js"></script>
    <script src="src/3d/ThreeHouseMap.js"></script>
    <script src="src/3d/ThreeControls.js"></script>
    <script src="src/3d/ThreeInteraction.js"></script>
    <script src="src/aaa/AAAExperienceScene.js"></script>
    <script>
        (function boot() {
            const params = new URLSearchParams(location.search);
            const capture = params.get('capture');
            if (params.get('hud') === '0' || capture) document.body.classList.add('qa-clean');
            const dialog = document.getElementById('dialog-panel');
            const title = document.getElementById('dialog-title');
            const text = document.getElementById('dialog-text');
            window.show3dDialog = (speaker, message) => { title.textContent = speaker || '调查'; text.textContent = message || ''; dialog.classList.add('is-visible'); };
            document.getElementById('dialog-close').addEventListener('click', () => dialog.classList.remove('is-visible'));
            document.getElementById('return-title').addEventListener('click', () => { location.href = 'index.html'; });
            const scene = new window.Huisha3D.AAAExperienceScene({
                root: document.getElementById('three-root'),
                prompt: document.getElementById('interaction-prompt'),
                objective: document.getElementById('objective-panel'),
                onDialog: window.show3dDialog,
                qaSeed: params.get('qaSeed'),
                qaDpr: params.get('qaDpr')
            });
            scene.start();
            scene.setCapturePose(capture || params.get('shot'));
            const finalizeQA = () => {
                if (params.has('qaTime')) scene.renderAt(params.get('qaTime'));
                window.__HUISHA_QA_READY__ = {
                    ready: true,
                    pose: capture || params.get('shot') || null,
                    time: params.has('qaTime') ? Number(params.get('qaTime')) : null,
                    seed: scene.qaSeed,
                    viewport: [scene.root.clientWidth, scene.root.clientHeight],
                    dpr: scene.renderer.getPixelRatio()
                };
            };
            scene.assetsReady.then(finalizeQA);
            window.huishaAAAScene = scene;
        })();
    </script>
</body>
</html>

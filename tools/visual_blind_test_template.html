<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回煞视觉盲测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0b0d;color:#e7e2d8;font-family:"Microsoft YaHei UI",sans-serif}.shell{max-width:1680px;margin:auto;padding:28px}h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.08em}.note{margin:8px 0 22px;color:#85898f;font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{position:relative;margin:0;border:1px solid #292c31;background:#050607}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.label{position:absolute;top:12px;left:12px;width:34px;height:34px;display:grid;place-items:center;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.3);font-size:14px}.actions{display:flex;justify-content:center;gap:14px;margin:24px 0}.actions button{border:1px solid #3a3e45;background:#15171b;color:#eee;padding:11px 26px;cursor:pointer}.actions button:hover{border-color:#a58252}.rubric{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;color:#9da1a8;font-size:12px}.rubric span{padding:10px;border-top:1px solid #2a2d33}.result{text-align:center;min-height:24px;color:#c4a36e;font-size:13px}@media(max-width:860px){.pair{grid-template-columns:1fr}.rubric{grid-template-columns:1fr 1fr}.shell{padding:16px}}
</style>
</head>
<body><main class="shell"><h1>匿名画面并排盲测</h1><p class="note">不要猜版本来源；只按画面判断。优先比较空间可读性、材质可信度、光影层次、细节密度与整体完成度。</p><section class="pair"><figure class="card"><img src="A.png" alt="候选画面 A"><b class="label">A</b></figure><figure class="card"><img src="B.png" alt="候选画面 B"><b class="label">B</b></figure></section><div class="actions"><button data-choice="A">A 更好</button><button data-choice="tie">难分优劣</button><button data-choice="B">B 更好</button></div><p class="result" id="result"></p><div class="rubric"><span>空间与路径是否一眼可读</span><span>材质是否有重量与尺度</span><span>主次光源是否合理</span><span>近中远景是否有层次</span><span>是否存在明显贴片/低模穿帮</span></div></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const choice=button.dataset.choice;const record={choice,time:new Date().toISOString()};localStorage.setItem('huisha-visual-blind-vote',JSON.stringify(record));document.getElementById('result').textContent=choice==='tie'?'已记录：难分优劣':`已记录：画面 ${choice} 更好`;document.querySelectorAll('button').forEach(item=>item.disabled=true)}));</script></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回煞 VFX 四时相盲测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090b;color:#e7e2d8;font-family:"Microsoft YaHei UI",sans-serif}.shell{max-width:1760px;margin:auto;padding:28px}h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.08em}.note{margin:8px 0 22px;color:#8d9198;font-size:13px}.grid{display:grid;grid-template-columns:52px 1fr 1fr;gap:10px}.head,.time{display:grid;place-items:center;color:#b9aa91;border:1px solid #292c31;background:#111318}.head{min-height:42px;font-size:14px}.time{font-size:12px}.frame{margin:0;border:1px solid #292c31;background:#030405}.frame img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.actions{display:flex;justify-content:center;gap:14px;margin:24px 0}.actions button{border:1px solid #3a3e45;background:#15171b;color:#eee;padding:11px 26px;cursor:pointer}.actions button:hover{border-color:#a58252}.result{text-align:center;min-height:24px;color:#c4a36e;font-size:13px}.rubric{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;color:#9da1a8;font-size:12px}.rubric span{padding:10px;border-top:1px solid #2a2d33}@media(max-width:920px){.shell{padding:14px}.grid{grid-template-columns:36px 1fr}.head.a{grid-column:2}.head.b{display:none}.frame.b{grid-column:2}.time{grid-row:span 2}.rubric{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="shell"><h1>匿名 VFX 四时相并排盲测</h1><p class="note">A、B 各自是同一版本的有序四帧；禁止逐帧拆开判断或猜版本来源。比较火焰、烟、尘、水、湿面的一致性、自然度、画面噪声与整体完成度。</p><section class="grid"><div></div><b class="head a">A</b><b class="head b">B</b><b class="time">T0</b><figure class="frame"><img src="A/frame-00.png" alt="A T0"></figure><figure class="frame b"><img src="B/frame-00.png" alt="B T0"></figure><b class="time">T1</b><figure class="frame"><img src="A/frame-01.png" alt="A T1"></figure><figure class="frame b"><img src="B/frame-01.png" alt="B T1"></figure><b class="time">T2</b><figure class="frame"><img src="A/frame-02.png" alt="A T2"></figure><figure class="frame b"><img src="B/frame-02.png" alt="B T2"></figure><b class="time">T3</b><figure class="frame"><img src="A/frame-03.png" alt="A T3"></figure><figure class="frame b"><img src="B/frame-03.png" alt="B T3"></figure></section><div class="actions"><button data-choice="A">A 整组更好</button><button data-choice="tie">难分优劣</button><button data-choice="B">B 整组更好</button></div><p class="result" id="result"></p><div class="rubric"><span>火焰形态与灯光是否同步</span><span>香烟是否上升、扩散、自然消散</span><span>尘粒是否柔和且无方块/刚体云</span><span>漏水、溅射、涟漪与湿面是否同源</span><span>四时相有无跳变、排序或过量噪声</span></div></main><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{const choice=button.dataset.choice;const record={choice,time:new Date().toISOString()};localStorage.setItem('huisha-vfx-blind-vote',JSON.stringify(record));document.getElementById('result').textContent=choice==='tie'?'已记录：难分优劣':`已记录：整组 ${choice} 更好`;document.querySelectorAll('button').forEach(item=>item.disabled=true)}));</script></body></html>
